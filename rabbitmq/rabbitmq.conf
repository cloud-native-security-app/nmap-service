# Configuración de RabbitMQ para el entorno local/de tests de este repo.
#
# `load_definitions` (SIN el prefijo `management.`) carga
# rabbitmq/definitions.json al arrancar el nodo. Se usa la clave núcleo
# (no `management.load_definitions`) porque, según un issue documentado de
# docker-library/rabbitmq (#428), `management.load_definitions` falla en
# cargar policies de forma fiable durante el PRIMER arranque del
# contenedor, mientras que `load_definitions` (soportada desde RabbitMQ
# 3.8.2+) sí funciona correctamente en el primer boot. Ver
# progress/explore_definitions_format.md §0 para el detalle completo y las
# fuentes.
load_definitions = /etc/rabbitmq/definitions.json

# TLS (AMQPS, puerto 5671) — feature `tls`. Certificado/clave de
# laboratorio generados por rabbitmq/generate-lab-certs.sh (NUNCA
# material real de producción, ver rabbitmq/README.md). Sin
# ssl_options.verify/fail_if_no_peer_cert: se exige TLS de transporte
# servidor, no mTLS (ver docs/security-scope.md — no aplica aquí).
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/tls/ca_certificate.pem
ssl_options.certfile   = /etc/rabbitmq/tls/server_certificate.pem
ssl_options.keyfile    = /etc/rabbitmq/tls/server_key.pem
