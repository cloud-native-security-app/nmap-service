[package]
name = "nmap-service"
version = "0.1.0"
edition = "2021"
description = "Microservicio ms-nmap: escaneo remoto de puertos/servicios/vulnerabilidades vía SSH + nmap"
publish = false

[lib]
name = "nmap_service"
path = "src/lib.rs"

[[bin]]
name = "ms-nmap"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known"] }
russh = { version = "0.63", default-features = false, features = ["ring"] }
roxmltree = "0.21"
mongodb = "3"
async-trait = "0.1"
csv = "1"
# `tokio_util::sync::CancellationToken` para la cancelación cooperativa de un
# escaneo en curso (feature `scan_cancellation`). Ya llega transitivamente vía
# mongodb/russh/reqwest (ver Cargo.lock), pero Cargo exige declarar como
# dependencia directa cualquier crate usado desde `src/`. El módulo `sync`
# (que incluye `CancellationToken`) no está detrás de ningún feature flag de
# `tokio-util` (a diferencia de `codec`/`net`/`rt`/`time`), así que no hace
# falta activar ninguno: las features por defecto (vacías) ya alcanzan.
tokio-util = "0.7"
# Cliente HTTP para el adaptador `enrichment::nvd::NvdApiEnricher` (API NVD
# 2.0). `default-features = false` + `rustls-tls` evita arrastrar OpenSSL/
# `native-tls`: mismo TLS que ya usa `mongodb` en este crate.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
testcontainers = "0.24"
time = { version = "0.3", features = ["macros"] }
# Servidor HTTP mock local para testear `NvdApiEnricher` sin egress de red real
# hacia `services.nvd.nist.gov` (ver `docs/security-scope.md`).
wiremock = "0.6"
