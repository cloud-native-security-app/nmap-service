[package]
name = "nmap-service"
version = "0.1.0"
edition = "2021"
description = "Microservicio ms-nmap: escaneo remoto de puertos/servicios/vulnerabilidades vía SSH + nmap"
publish = false

[lib]
name = "nmap_service"
path = "src/lib.rs"

[[bin]]
name = "ms-nmap"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known"] }

[dev-dependencies]
testcontainers = "0.24"
time = { version = "0.3", features = ["macros"] }
