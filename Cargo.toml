[package]
name = "nmap-service"
version = "0.1.0"
edition = "2021"
description = "Microservicio ms-nmap: escaneo remoto de puertos/servicios/vulnerabilidades vía SSH + nmap"
publish = false

[lib]
name = "nmap_service"
path = "src/lib.rs"

[[bin]]
name = "ms-nmap"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known"] }
russh = { version = "0.63", default-features = false, features = ["ring"] }
roxmltree = "0.21"
mongodb = "3"
async-trait = "0.1"
csv = "1"
# `tokio_util::sync::CancellationToken` para la cancelación cooperativa de un
# escaneo en curso (feature `scan_cancellation`). Ya llega transitivamente vía
# mongodb/russh/reqwest (ver Cargo.lock), pero Cargo exige declarar como
# dependencia directa cualquier crate usado desde `src/`. El módulo `sync`
# (que incluye `CancellationToken`) no está detrás de ningún feature flag de
# `tokio-util` (a diferencia de `codec`/`net`/`rt`/`time`), así que no hace
# falta activar ninguno: las features por defecto (vacías) ya alcanzan.
tokio-util = "0.7"
# Cliente HTTP para el adaptador `enrichment::nvd::NvdApiEnricher` (API NVD
# 2.0). `default-features = false` + `rustls-tls` evita arrastrar OpenSSL/
# `native-tls`: mismo TLS que ya usa `mongodb` en este crate.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Cliente AMQPS del adaptador real de broker (`src/messaging/rabbitmq.rs`,
# feature `broker_adapter`). Mismas versiones que fija `gateway/Cargo.toml`
# (mismo runtime tokio, mismo patrón ya investigado y verificado en
# `gateway/progress/explore_lapin_publish.md`): `lapin` 2.x resuelve
# `default-features = false, features = ["rustls"]` a
# `rustls -> rustls-native-certs` (verificación TLS con el almacén de
# certificados nativo del proceso en producción; los tests de integración
# pasan además la CA de laboratorio vía `OwnedTLSConfig::cert_chain`).
lapin = { version = "2", features = ["rustls"], default-features = false }
# Adapta el executor/reactor de `lapin` al runtime `tokio` que ya usa el
# resto de este servicio, en vez de dejar que use su propio pool de hilos
# (`async-global-executor`) — ver `gateway/progress/explore_lapin_publish.md`
# §3. Son dev-dependencies del propio `lapin` (solo en sus ejemplos/tests),
# no algo que un consumidor arrastre transitivamente.
tokio-executor-trait = "2"
tokio-reactor-trait = "1"
# `Consumer` de `lapin` es un `Stream<Item = Result<Delivery>>`; `.next()`
# sobre él en `RabbitMqScanRequestSource`/`RabbitMqScanCancellationSource` es
# código de producción (`src/messaging/rabbitmq.rs`), no solo de test.
futures-util = "0.3"

[dev-dependencies]
testcontainers = "0.24"
time = { version = "0.3", features = ["macros"] }
# Servidor HTTP mock local para testear `NvdApiEnricher` sin egress de red real
# hacia `services.nvd.nist.gov` (ver `docs/security-scope.md`).
wiremock = "0.6"
# Instalación defensiva del backend criptográfico de `rustls` antes de la
# primera conexión AMQPS en los tests de integración de `broker_adapter`
# (gotcha de doble-proveedor `rustls` documentado en
# `gateway/progress/explore_lapin_testcontainers.md` §4: si el binario de
# test trae dos proveedores criptográficos compilados a la vez, la primera
# conexión AMQPS se cuelga en vez de fallar). Verificado en `Cargo.lock` de
# este repo tras añadir `lapin`: solo aparece `ring`, no `aws-lc-rs`, así que
# hoy no debería reproducirse — se instala igual como medida defensiva
# barata, mismo patrón que adoptó `gateway`.
rustls = "0.23"
