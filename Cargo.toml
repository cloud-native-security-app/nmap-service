[package]
name = "nmap-service"
version = "0.1.0"
edition = "2021"
description = "Microservicio ms-nmap: escaneo remoto de puertos/servicios/vulnerabilidades vía SSH + nmap"
publish = false

[lib]
name = "nmap_service"
path = "src/lib.rs"

[[bin]]
name = "ms-nmap"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10"
thiserror = "2"
# URLs de colas SQS y endpoint AWS en `config` (ya en Cargo.lock vía reqwest).
url = "2"
time = { version = "0.3", features = ["serde-well-known"] }
russh = { version = "0.63", default-features = false, features = ["ring"] }
roxmltree = "0.21"
mongodb = "3"
async-trait = "0.1"
csv = "1"
# `tokio_util::sync::CancellationToken` para la cancelación cooperativa de un
# escaneo en curso (feature `scan_cancellation`). Ya llega transitivamente vía
# mongodb/russh/reqwest (ver Cargo.lock), pero Cargo exige declarar como
# dependencia directa cualquier crate usado desde `src/`. El módulo `sync`
# (que incluye `CancellationToken`) no está detrás de ningún feature flag de
# `tokio-util` (a diferencia de `codec`/`net`/`rt`/`time`), así que no hace
# falta activar ninguno: las features por defecto (vacías) ya alcanzan.
tokio-util = "0.7"
# Cliente HTTP para el adaptador `enrichment::nvd::NvdApiEnricher` (API NVD
# 2.0). `default-features = false` + `rustls-tls` evita arrastrar OpenSSL/
# `native-tls`: mismo TLS que ya usa `mongodb` en este crate.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Adaptadores SQS (`src/messaging/sqs.rs`, MSG-NM-02). Mismas versiones mayores
# que `gateway/Cargo.toml`. Credenciales: cadena por defecto de AWS (rol de la
# tarea ECS), sin claves estáticas.
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-sqs = "1.114.0"
# Publicador de desenlaces en SNS (`src/messaging/sns.rs`, MSG-NM-03); misma
# versión que `gateway/Cargo.toml`.
aws-sdk-sns = "1.116.0"
# Publicador de eventos de seguridad en Kinesis (`src/messaging/kinesis.rs`, KAP-07).
# Se fija `1.125.0` (igual que `gateway/Cargo.toml`): es el último lanzamiento que
# acepta el `aws-runtime` 1.10.0 / `aws-smithy-runtime` 1.16.0 ya fijados en el lock
# para `aws-sdk-sns`/`-sqs` (versiones posteriores obligan a subirlos).
aws-sdk-kinesis = "1.125.0"
# Identificador único (UUID v4) de cada `SecurityEvent` (`src/security_events.rs`,
# KAP-07); ya está resuelta transitivamente, se declara explícita para nombrarla.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
testcontainers = "0.24"
time = { version = "0.3", features = ["macros"] }
# Servidor HTTP mock local para testear `NvdApiEnricher` sin egress de red real
# hacia `services.nvd.nist.gov` (ver `docs/security-scope.md`).
wiremock = "0.6"
# `start_paused`/`advance` para probar el tope de tiempo de `emit` sin esperas
# de reloj (`src/security_events.rs`).
tokio = { version = "1", features = ["test-util"] }
# Valida cada evento emitido contra `../broker/contracts/security-event.schema.json`
# (`tests/security_event_contract.rs`). Misma versión y features que `broker`.
jsonschema = { version = "0.56", default-features = false }
